name: dll-ios
on:
  workflow_dispatch:
  push:
    paths:
      - "dll_pacote/**"

jobs:
  dll:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Carregar os dylibs no simulador (host em C, dlopen)
        run: bash rodar_dll.sh dll_pacote resultado_dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-dll
          path: resultado_dll/
