name: pacote-ios
on:
  workflow_dispatch:
  push:
    paths:
      - "pacote/**"
      - "rodar_pacote.sh"
      - ".github/workflows/pacote.yml"

jobs:
  pacote:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rodar o pacote no simulador
        run: bash rodar_pacote.sh pacote resultado
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-pacote
          path: resultado/
